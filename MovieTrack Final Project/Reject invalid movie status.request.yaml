$kind: http-request
url: "{{baseUrl}}/movies/{{movieId}}"
method: PATCH
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "status": "Invalid"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
      pm.test("Request ID is returned", () => pm.expect(pm.response.headers.has("X-Request-Id")).to.eql(true));
      pm.test("Standard error response", () => pm.expect(pm.response.json().statusCode).to.eql(400));
    language: text/javascript
order: 15000
