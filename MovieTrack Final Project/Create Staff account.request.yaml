$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "fullName": "Demo Staff",
      "email": "{{staffEmail}}",
      "role": "Staff",
      "password": "{{staffPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Request ID is returned", () => pm.expect(pm.response.headers.has("X-Request-Id")).to.eql(true));
      if (pm.response.code === 201) pm.collectionVariables.set("userId", pm.response.json().userId);
    language: text/javascript
order: 4000
