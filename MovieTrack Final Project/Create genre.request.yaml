$kind: http-request
url: "{{baseUrl}}/genres"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "genreName": "Demo Genre {{$timestamp}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Request ID is returned", () => pm.expect(pm.response.headers.has("X-Request-Id")).to.eql(true));
      if (pm.response.code === 201) pm.collectionVariables.set("genreId", pm.response.json().genreId);
    language: text/javascript
order: 16000
