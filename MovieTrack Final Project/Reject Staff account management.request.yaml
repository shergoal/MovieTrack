$kind: http-request
url: "{{baseUrl}}/users"
method: GET
headers:
  Accept: application/json
  Authorization: Bearer {{staffToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 403", () => pm.response.to.have.status(403));
      pm.test("Request ID is returned", () => pm.expect(pm.response.headers.has("X-Request-Id")).to.eql(true));
      pm.test("Standard error response", () => pm.expect(pm.response.json().statusCode).to.eql(403));
    language: text/javascript
order: 9000
