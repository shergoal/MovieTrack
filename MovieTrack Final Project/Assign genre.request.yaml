$kind: http-request
url: "{{baseUrl}}/movie-genres"
method: POST
headers:
  Accept: application/json
  Authorization: Bearer {{staffToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "movieId": {{movieId}},
      "genreId": {{genreId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
      pm.test("Request ID is returned", () => pm.expect(pm.response.headers.has("X-Request-Id")).to.eql(true));
      if (pm.response.code === 201) pm.collectionVariables.set("movieGenreId", pm.response.json().movieGenreId);
    language: text/javascript
order: 20000
